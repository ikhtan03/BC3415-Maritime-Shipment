<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1110" width="940" height="1110">
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172435}.head{font-size:20px;font-weight:700}.sub{font-size:14px}.tag{font-size:15px;font-weight:bold;fill:#175c52}.arrow{stroke:#526779;stroke-width:2.2;fill:none;marker-end:url(#arr)}.box{fill:#f4f8fb;stroke:#9db4c8;stroke-width:1.4}.green{fill:#eaf8f0;stroke:#72ae8c;stroke-width:1.6}.blue{fill:#eaf1ff;stroke:#8ca7df;stroke-width:1.6}.gold{fill:#fff7e7;stroke:#d4b771;stroke-width:1.4}.foot{font-size:13px;fill:#485d6c}</style>
<defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#526779"/></marker></defs>
<text class="head" x="470" y="35" text-anchor="middle">Maritime DG — Agentic Workflow and Dataset Mapping</text>
<rect class="green" x="265" y="53" width="410" height="85" rx="12"/><text class="head" x="470" y="83" text-anchor="middle">A — Shipping PDFs</text><text class="sub" x="470" y="108" text-anchor="middle">Only runtime dataset input (1–4 documents)</text>
<path class="arrow" d="M470 138V175"/>
<rect class="box" x="250" y="175" width="440" height="86" rx="11"/><text class="head" x="470" y="205" text-anchor="middle">1. LLM extraction</text><text class="sub" x="470" y="231" text-anchor="middle">PDFs → JSON per document</text>
<rect class="green" x="705" y="175" width="220" height="86" rx="10"/><text class="tag" x="815" y="198" text-anchor="middle">B — ground_truth.json</text><text class="sub" x="815" y="220" text-anchor="middle">Compare extracted JSON</text><text class="sub" x="815" y="239" text-anchor="middle">to document_truth</text>
<path class="arrow" d="M690 218H704"/><text class="foot" x="700" y="168" text-anchor="middle">TEST ONLY</text>
<path class="arrow" d="M470 261V315"/>
<rect class="box" x="250" y="315" width="440" height="88" rx="11"/><text class="head" x="470" y="345" text-anchor="middle">2. Python validation</text><text class="sub" x="470" y="370" text-anchor="middle">Extracted JSON → missing-document checks</text><text class="sub" x="470" y="388" text-anchor="middle">and cross-document discrepancies</text>
<rect class="gold" x="705" y="315" width="220" height="88" rx="10"/><text class="tag" x="815" y="339" text-anchor="middle">C — answer_key.json</text><text class="sub" x="815" y="361" text-anchor="middle">Compare detected findings</text><text class="sub" x="815" y="380" text-anchor="middle">to expected_findings</text>
<path class="arrow" d="M690 359H704"/><text class="foot" x="700" y="308" text-anchor="middle">TEST ONLY</text>
<path class="arrow" d="M470 403V455"/>
<rect class="blue" x="250" y="455" width="440" height="119" rx="11"/><text class="head" x="470" y="485" text-anchor="middle">3. Agentic verification loop</text><text class="sub" x="470" y="511" text-anchor="middle">Re-extract flagged fields (maximum 2 rounds)</text><text class="sub" x="470" y="532" text-anchor="middle">If values change → rerun Python rules</text><text class="sub" x="470" y="554" text-anchor="middle">Keep confirmed/uncertain issues with evidence</text>
<rect class="green" x="705" y="455" width="220" height="119" rx="10"/><text class="tag" x="815" y="478" text-anchor="middle">B + C + V fixtures</text><text class="sub" x="815" y="501" text-anchor="middle">Evaluate corrections,</text><text class="sub" x="815" y="520" text-anchor="middle">remaining findings,</text><text class="sub" x="815" y="539" text-anchor="middle">and mock false positives</text><text class="foot" x="815" y="560" text-anchor="middle">TEST ONLY</text><path class="arrow" d="M690 516H704"/>
<path class="arrow" d="M470 574V626"/>
<rect class="blue" x="250" y="626" width="440" height="104" rx="11"/><text class="head" x="470" y="655" text-anchor="middle">4. Agentic RAG query planning</text><text class="sub" x="470" y="678" text-anchor="middle">Generate search topics from extracted shipment data</text><text class="sub" x="470" y="699" text-anchor="middle">Retrieve official regulatory evidence</text>
<rect class="gold" x="705" y="626" width="220" height="104" rx="10"/><text class="tag" x="815" y="650" text-anchor="middle">C — answer_key.json</text><text class="sub" x="815" y="672" text-anchor="middle">Suggested RAG topics</text><text class="sub" x="815" y="691" text-anchor="middle">(not verified legal verdicts)</text><text class="foot" x="815" y="712" text-anchor="middle">TEST ONLY</text><path class="arrow" d="M690 678H704"/>
<rect class="gold" x="15" y="626" width="220" height="104" rx="10"/><text class="tag" x="125" y="650" text-anchor="middle">Regulatory knowledge base</text><text class="sub" x="125" y="673" text-anchor="middle">Official MPA / Customs</text><text class="sub" x="125" y="693" text-anchor="middle">sources (not A/B/C)</text><path class="arrow" d="M235 679H249"/>
<path class="arrow" d="M470 730V781"/>
<rect class="box" x="250" y="781" width="440" height="86" rx="11"/><text class="head" x="470" y="812" text-anchor="middle">5. Python risk triage + report</text><text class="sub" x="470" y="838" text-anchor="middle">Issue findings, evidence, and human-review recommendation</text>
<rect class="gold" x="705" y="781" width="220" height="86" rx="10"/><text class="tag" x="815" y="804" text-anchor="middle">C — answer_key.json</text><text class="sub" x="815" y="826" text-anchor="middle">Evaluate expected findings</text><text class="sub" x="815" y="845" text-anchor="middle">and triage labels</text><path class="arrow" d="M690 827H704"/>
<path class="arrow" d="M470 867V923"/>
<rect class="box" x="250" y="923" width="440" height="78" rx="11"/><text class="head" x="470" y="953" text-anchor="middle">6. Web app result</text><text class="sub" x="470" y="980" text-anchor="middle">Show findings, citations and human escalation</text>
<text class="foot" x="470" y="1045" text-anchor="middle">B / C / V are hidden evaluation files; never expose them to the runtime LLM or RAG index.</text>
<text class="foot" x="470" y="1068" text-anchor="middle">The validator checks document consistency, not legal compliance.</text>
</svg>