<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1130" viewBox="0 0 1500 1130" role="img" aria-labelledby="title desc">
<title id="title">PortDoc AI implemented workflow and synthetic dataset mapping</title>
<desc id="desc">Runtime: PDF upload, extraction, deterministic validation, conditional document re-extraction, review triage, conditional RAG context, JSON report and Streamlit review. Dataset ground truths, answer keys and verification fixtures are offline evaluation references only.</desc>
<defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#193249} .h{font-weight:700;font-size:30px}.sub{font-size:17px;fill:#536779}.small{font-size:15px;fill:#536779}.label{font-size:20px;font-weight:700}.detail{font-size:16px}.tiny{font-size:14px;fill:#536779}.pill{font-size:14px;font-weight:700;fill:#20635a}.offline{font-size:17px;font-weight:700}.arrow{fill:none;stroke:#5d788c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round} .dash{stroke-dasharray:7 7;stroke:#98a7b4;stroke-width:2;fill:none}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#5d788c" stroke-width="1.5"/></marker></defs>
<rect width="1500" height="1130" fill="#ffffff"/>
<text x="72" y="64" class="h">PortDoc AI — Implemented Workflow &amp; Dataset Mapping</text>
<text x="72" y="96" class="sub">Based on feat/rag-in-pipeline • academic document pre-check • no regulatory clearance</text>
<rect x="60" y="125" width="855" height="933" rx="20" fill="#fff" stroke="#dbe3e9" stroke-width="2"/>
<rect x="944" y="125" width="496" height="933" rx="20" fill="#fbfcfd" stroke="#dbe3e9" stroke-width="2"/>
<text x="82" y="160" class="offline">RUNTIME APPLICATION</text>
<text x="968" y="160" class="offline">OFFLINE EVALUATION ONLY</text>
<rect x="76" y="183" width="820" height="95" rx="14" fill="#e9f4f1" stroke="#a6cdc3" stroke-width="2"/>
<text x="99" y="217" class="label">A · Upload synthetic shipping PDFs</text>
<text x="99" y="242" class="detail">Streamlit: B/L, invoice, packing list, DGD</text>
<text x="99" y="262" class="detail">Selectable-text PDFs; S04 intentionally has no DGD</text>
<rect x="76" y="310" width="820" height="95" rx="14" fill="#f5f8fa" stroke="#cad8e1" stroke-width="2"/>
<text x="99" y="344" class="label">1 · Gemini extraction</text>
<text x="99" y="369" class="detail">PyMuPDF text + document identification + Gemini</text>
<text x="99" y="389" class="detail">Output: documents, upload_inventory, extraction_metadata</text>
<rect x="76" y="437" width="820" height="95" rx="14" fill="#e9f4f1" stroke="#a6cdc3" stroke-width="2"/>
<text x="99" y="471" class="label">2 · Deterministic validation</text>
<text x="99" y="496" class="detail">Backend/validator.py: presence, weight, container, DG class</text>
<text x="99" y="516" class="detail">Uploaded-but-unextracted PDFs → extraction_failed</text>
<rect x="76" y="564" width="820" height="95" rx="14" fill="#f5f8fa" stroke="#cad8e1" stroke-width="2"/>
<text x="99" y="598" class="label">3 · Conditional verification</text>
<text x="99" y="623" class="detail">If comparable findings flagged: re-extract selected whole PDFs</text>
<text x="99" y="643" class="detail">Up to 2 rounds; rerun validation after each round</text>
<rect x="76" y="691" width="820" height="95" rx="14" fill="#e9f4f1" stroke="#a6cdc3" stroke-width="2"/>
<text x="99" y="725" class="label">4 · Human-review triage</text>
<text x="99" y="750" class="detail">Backend/triage.py: suggested priority and review flag</text>
<text x="99" y="770" class="detail">Illustrative recommendations, not legal risk classifications</text>
<rect x="76" y="818" width="820" height="95" rx="14" fill="#f5f8fa" stroke="#cad8e1" stroke-width="2"/>
<text x="99" y="852" class="label">5 · Conditional regulatory context (RAG)</text>
<text x="99" y="877" class="detail">Only applicable findings: DG class conflict or missing DGD</text>
<text x="99" y="897" class="detail">Planner → retrieval → citation-checked answer; other findings N/A</text>
<rect x="76" y="945" width="820" height="95" rx="14" fill="#e9f4f1" stroke="#a6cdc3" stroke-width="2"/>
<text x="99" y="979" class="label">6 · JSON report + Streamlit results</text>
<text x="99" y="1004" class="detail">Findings, evidence, checks, priority and regulatory context</text>
<text x="99" y="1024" class="detail">Human review required; compliance is NOT ASSESSED</text>
<path d="M486 279 V302" class="arrow" marker-end="url(#arrow)"/>
<path d="M486 406 V429" class="arrow" marker-end="url(#arrow)"/>
<path d="M486 533 V556" class="arrow" marker-end="url(#arrow)"/>
<path d="M486 660 V683" class="arrow" marker-end="url(#arrow)"/>
<path d="M486 787 V810" class="arrow" marker-end="url(#arrow)"/>
<path d="M486 914 V937" class="arrow" marker-end="url(#arrow)"/>
<rect x="965" y="204" width="454" height="144" rx="14" fill="#f5f9fc" stroke="#bed0df" stroke-width="2"/>
<rect x="965" y="382" width="454" height="150" rx="14" fill="#f5f9fc" stroke="#bed0df" stroke-width="2"/>
<rect x="965" y="568" width="454" height="150" rx="14" fill="#f5f9fc" stroke="#bed0df" stroke-width="2"/>
<rect x="965" y="752" width="454" height="190" rx="14" fill="#f5f9fc" stroke="#bed0df" stroke-width="2"/>
<text x="989" y="236" class="label">B · ground_truth.json</text>
<text x="989" y="266" class="detail">shipment_truth: baseline shipment</text>
<text x="989" y="290" class="detail">document_truth: values actually printed</text>
<text x="989" y="314" class="small">Used to score extraction, not as LLM input</text>
<text x="989" y="414" class="label">C · answer_key.json</text>
<text x="989" y="444" class="detail">Expected finding types and counts</text>
<text x="989" y="468" class="detail">Verification and triage expectations</text>
<text x="989" y="492" class="small">RAG topics are suggestions, not legal labels</text>
<text x="989" y="600" class="label">V · verification fixtures</text>
<text x="989" y="630" class="detail">V01: simulated false mismatch clears</text>
<text x="989" y="654" class="detail">V02: genuine mismatch persists</text>
<text x="989" y="678" class="small">Mock offline data; not loaded by app</text>
<text x="989" y="784" class="label">Actual test boundaries</text>
<text x="989" y="815" class="detail">B: compare with extraction documents</text>
<text x="989" y="841" class="detail">C: compare with validation and triage</text>
<text x="989" y="867" class="detail">V: feed fake re-extractor to verify()</text>
<text x="989" y="899" class="small">No B/C/V in runtime prompts or RAG index</text>
<path d="M932 348 h-28" class="dash"/>
<path d="M932 501 h-28" class="dash"/>
<path d="M932 718 h-28" class="dash"/>
<text x="978" y="997" class="small">Dataset: 6 scenarios · 23 synthetic PDFs</text>
<text x="978" y="1024" class="small">Never treat prototype output as DG approval</text>
<text x="72" y="1100" class="tiny">Implementation note: triage occurs before regulatory context attachment in Backend/run_pipeline.py.</text>
</svg>